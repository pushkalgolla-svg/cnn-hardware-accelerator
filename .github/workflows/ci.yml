name: Hardware Verification & Synthesis CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-synthesize:
    name: RTL Verification & Yosys Synthesis Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install EDA Tools (Icarus Verilog & Yosys)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys yosys-abc
          pip install yowasp-yosys

      - name: Verify Toolchain Installation
        run: |
          python3 --version
          iverilog -V
          which yowasp-yosys || which yosys
          yowasp-yosys -V || yosys -V

      - name: Generate Independent Golden Vectors
        run: |
          python3 scripts/golden_model.py

      - name: Run Multi-Vector RTL Regression Suite (iverilog + vvp)
        run: |
          python3 scripts/run_verification.py

      - name: Execute ASIC Gate-Level Synthesis Benchmark (Yosys + ABC)
        run: |
          python3 scripts/synth_benchmark.py

      - name: Audit Static Timing Analysis & Logic Depth
        run: |
          python3 scripts/run_sta.py

      - name: Validate Synthesis Benchmark Report & PPA Metrics
        run: |
          python3 scripts/validate_benchmark.py

      - name: Run Architectural Comparison & Sanity Checks
        run: |
          python3 scripts/compare_architectures.py
